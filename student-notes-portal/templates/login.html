{% extends "base.html" %}

{% block title %}Log In - Student Notes Sharing Portal{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    
    <div class="auth-header">
      <div class="auth-icon-circle">🔐</div>
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Sign in to your account to upload notes and view your personal repository.</p>
    </div>

    <form action="{{ url_for('login', next=request.args.get('next')) }}" method="POST" class="auth-form" id="login-form">
      
      <!-- Username or Email Field -->
      <div class="form-group">
        <label for="login_input" class="form-label form-label-required">Username or Email</label>
        <input 
          type="text" 
          name="login_input" 
          id="login_input" 
          class="form-control" 
          placeholder="Username or your email address" 
          value="{{ login_input or '' }}"
          required 
          autocomplete="username"
        >
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label for="password" class="form-label form-label-required">Password</label>
        <input 
          type="password" 
          name="password" 
          id="password" 
          class="form-control" 
          placeholder="••••••••" 
          required 
          autocomplete="current-password"
        >
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn btn-primary btn-lg" id="btn-submit-login" style="width: 100%; margin-top: 0.5rem;">
        Log In
      </button>

    </form>

    <div class="auth-footer">
      <span>Don't have an account? </span>
      <a href="{{ url_for('register') }}" id="link-to-register"><strong>Create one here</strong></a>
    </div>

  </div>
</div>
{% endblock %}
